[package]
name = "reel"
version = "0.0.1"
authors = ["Taha Sadough <tahasdx@gmail.com>"]
edition = "2021"
description = "Reel — the screen recorder backend for the Omarchy plugin"
license = "MIT"

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
